name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    name: Pages match content/ and contain no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      - run: python tools/build.py
      - run: git diff --exit-code -- public/ || (echo 'public/ is stale - run python tools/build.py and commit' && exit 1)
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
