# Cloudflare Workers static site for www.shrov.com (Workers Builds deploys main; no build step —
# public/ is committed, regenerated with tools/build.py).
name = "shrov-site"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "www.shrov.com", custom_domain = true }]

[assets]
directory = "./public"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
